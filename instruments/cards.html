<h1>樂器辨識卡（全部 <span id="cnt"></span> 種）</h1><p class="sub">每張卡有樂器照片、30 秒音色示範、聲音頻譜圖（播放時白線跟著走）、口訣。上方可以用分類篩選，或玩「盲聽測驗」（測驗只出現目前篩選的類別）。音量已統一。</p>
<div class="bar"><div id="cats"></div></div>
<div class="quiz"><b>盲聽測驗</b>　<button class="p" id="qs">隨機播一段</button><button id="qr">再聽一次</button><span id="sc" style="color:var(--m)"></span><div class="qspec" id="qs2"><i></i></div><img class="qimg" id="qi" alt=""><div class="opts" id="op"></div><div id="res"></div></div>
<div class="grid" id="g"></div>
<p class="note">聲音來源是 YouTube 上的公開演奏／示範，只截 30 秒供辨識學習，連結見每張卡；照片來自維基共享資源。自動挑選的錄音可能有少數不是最理想（卡片上有紅字提醒的），發現不對的請告訴我是哪一種，我換。</p>

cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{flt=c;render();[...cb.children].forEach(x=>x.classList.toggle('on',x===b))};if(c==='全部')b.classList.add('on');cb.appendChild(b)});
function list(){return D.filter(x=>flt==='全部'||x[3].startsWith(flt))}
function render(){g.innerHTML='';const L=list();document.getElementById('cnt').textContent=D.length;L.forEach(x=>{const d=document.createElement('div');d.className='card';d.id='c-'+x[0];d.innerHTML='<img class="ph" src="'+x[0]+'.jpg" alt="'+x[1]+'" onerror="this.style.display=\'none\'"><h2>'+x[1]+'<small>'+x[2]+'</small></h2><div class="fam">'+x[3]+'</div><button data-i="'+x[0]+'">▶ 播放音色</button><div class="spec" style="background-image:url('+x[0]+'-spec.png)"><i></i></div><div class="tip">'+x[4]+'</div>'+(x[8]?'<div class="warn">⚠ '+x[8]+'</div>':'')+'<div class="sun">寫進 Suno：'+x[5]+'</div><div class="src">來源：<a href="'+x[6]+'" target="_blank" rel="noopener">'+x[7]+'</a></div>';g.appendChild(d)});buildOpts()}
function buildOpts(){const op=document.getElementById('op');op.innerHTML='';list().forEach(x=>{const b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(!cur)return;tot++;const res=document.getElementById('res');if(x[0]===cur[0]){ok++;res.className='ok';res.textContent='答對了！是'+cur[1]}else{res.className='no';res.textContent='不是喔，這是'+cur[1]+'。口訣：'+cur[4]}const qi=document.getElementById('qi');qi.src=cur[0]+'.jpg';qi.style.display='block';document.getElementById('sc').textContent=' 成績 '+ok+' / '+tot;cur=null};op.appendChild(b)})}
g.addEventListener('click',e=>{const i=e.target.dataset.i;if(!i)return;if(act===i&&a.src&&!a.ended){a.paused?a.play():a.pause();return}act=i;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.id==='c-'+i));a.src=i+'.mp3';a.play();const it=D.find(x=>x[0]===i);document.getElementById('npt').textContent='現在播放：'+(it?it[1]:i)});
const npb=document.getElementById('npb'),np=document.getElementById('np'),npr=document.getElementById('npr');const fm=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');a.addEventListener('play',()=>{np.style.display='flex';npb.textContent='⏸ 暫停';syncBtn()});a.addEventListener('pause',()=>{npb.textContent='▶ 繼續';syncBtn()});a.addEventListener('ended',()=>{npb.textContent='↺ 再聽';syncBtn()});function syncBtn(){document.querySelectorAll('.card button[data-i]').forEach(b=>{b.textContent=(b.dataset.i===act&&!a.paused&&!a.ended)?'⏸ 暫停':(b.dataset.i===act&&a.paused&&!a.ended)?'▶ 繼續':'▶ 播放音色'})}npb.onclick=()=>{if(a.ended){a.currentTime=0;a.play()}else a.paused?a.play():a.pause()};document.getElementById('nps').onclick=()=>{a.pause();a.currentTime=0;np.style.display='none';act=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));syncBtn()};npr.oninput=()=>{if(a.duration)a.currentTime=a.duration*npr.value/100};function tick(){if(a.duration){npr.value=a.currentTime/a.duration*100;document.getElementById('npc').textContent=fm(a.currentTime)+' / '+fm(a.duration)}const d=a.duration||30,p=Math.min(100,(a.currentTime/d)*100)+'%';document.querySelectorAll('.spec i').forEach(x=>x.style.display='none');if(act){const s=document.querySelector('[id="c-'+act+'"] .spec i');if(s){s.style.display='block';s.style.left=p}}const q=document.querySelector('#qs2 i');if(q)q.style.left=p;requestAnimationFrame(tick)}tick();
document.getElementById('qs').onclick=()=>{document.getElementById('npt').textContent='現在播放：（測驗中，答完才揭曉）';const L=list();cur=L[Math.floor(Math.random()*L.length)];document.getElementById('res').textContent='';act=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));const q=document.getElementById('qs2');q.style.display='block';q.style.backgroundImage='url('+cur[0]+'-spec.png)';document.getElementById('qi').style.display='none';a.src=cur[0]+'.mp3';a.play()};
document.getElementById('qr').onclick=()=>{if(a.src){a.currentTime=0;a.play()}};
render();
</script></main></body></html>
