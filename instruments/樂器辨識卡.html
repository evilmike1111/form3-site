<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國樂樂器辨識卡</title>
<style>
:root{--bg:#080E11;--p:#0F181D;--l:#2A3C43;--t:#F2F6F5;--m:#9DB2B9;--a:#73DBD6;--o:#FFB86B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:17px/1.7 system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--m);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}
.card h2{margin:0;font-size:22px}.card h2 small{color:var(--m);font-size:14px;font-weight:400;margin-left:6px}
.fam{color:var(--a);font-size:14px;margin:2px 0 6px}.tip{font-size:15px;margin:6px 0}.sun{font-size:14px;color:var(--o);margin-top:6px;word-break:break-word}
.src{font-size:14px;color:var(--m)}.src a{color:var(--m)}
button{font:inherit;color:var(--t);background:#16222a;border:1px solid var(--l);border-radius:10px;padding:6px 14px;cursor:pointer}button.p{background:var(--a);color:#071B1C;border-color:var(--a);font-weight:700}
.quiz{background:var(--p);border:1px solid var(--a);border-radius:14px;padding:14px;margin:0 0 18px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#res{margin-top:10px;font-size:18px;min-height:1.6em}.ok{color:#9fe3a8}.no{color:#ff8f8f}
.note{color:var(--m);font-size:14px;margin-top:18px}.ph{width:100%;height:150px;object-fit:contain;background:#0a1216;border-radius:10px;margin:0 0 8px}.spec{position:relative;height:70px;border-radius:8px;overflow:hidden;background:#000 center/100% 100% no-repeat;margin:8px 0 4px}.spec i{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0;display:none}.card.on{border-color:var(--a);box-shadow:0 0 0 2px #73DBD655}.lg{color:var(--m);font-size:14px}.qspec{position:relative;height:90px;border-radius:8px;overflow:hidden;background:#000 center/100% 100% no-repeat;margin-top:10px;display:none}.qspec i{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0}.qimg{display:none;height:150px;margin-top:8px;border-radius:10px;background:#0a1216}
</style></head><body><main>
<h1>國樂樂器辨識卡（8 種）</h1><p class="sub">這一版是「音色示範」錄音（單音、慢彈、練習句），不是完整曲子，專門讓你聽每種樂器本身的聲音。每張卡有樂器照片和「聲音頻譜圖」：播放時白線會跟著走，你可以看見哪個音高在響、泛音多不多，把「聽到的」和「看到的」連起來。先逐張聽，再玩上面的「盲聽測驗」。音量已統一。</p>
<div class="quiz"><b>盲聽測驗</b>　<button class="p" id="qs">隨機播一段</button> <button id="qr">再聽一次</button> <span id="sc" style="color:var(--m)"></span><div class="qspec" id="qs2"><i></i></div><img class="qimg" id="qi" alt=""><div class="opts" id="op"></div><div id="res"></div></div>
<div class="grid" id="g"></div>
<p class="note">聲音來源是 YouTube 上的公開演奏，只截 30 秒供辨識學習，連結見每張卡。標示的樂器與演奏者以影片為準；洞簫、笙、揚琴等挑選的是音色示範或獨奏錄音；揚琴那段是軟體音色庫（用來示範音色，不是真人現場）。</p>
<audio id="a"></audio>
<script>
const D=[["guqin","古琴","Guqin","撥弦（七弦）","最低沉、最安靜。聽「滑音」（手指在弦上滑）和「泛音」（像小鈴鐺的清脆聲）。音量小、餘韻短。","guqin (seven-string zither), deep, quiet, sliding notes, harmonics","https://www.youtube.com/watch?v=neqQ99oBkpQ","演奏級古琴音色示範"],["guzheng","古箏","Guzheng","撥弦（21 弦）","清亮。聽「一串快速刮過」像流水，和左手把音「揉」出的滑音。比古琴亮、比琵琶柔。","guzheng (Chinese zither), flowing glissando, bright plucked strings","https://www.youtube.com/watch?v=-qyXDhKv8mk","古箏王朝 明清老紅木素箏音色示範"],["pipa","琵琶","Pipa","彈撥（4 弦）","顆粒分明、乾脆。聽「輪指」：一個音快速密集地顫。像吉他但更尖更脆。","pipa (Chinese lute), crisp plucked notes, rapid tremolo","https://www.youtube.com/watch?v=UhVy150mYUg","琵琶好聽音色／琵琶發音"],["erhu","二胡","Erhu","拉弦（2 弦）","像人在哭或唱。長音、大量滑音，哀婉。只要聽到「拉出來的長音」多半是它。","erhu (two-string fiddle), expressive sliding, voice-like, melancholic","https://www.youtube.com/watch?v=2alA6CzUFd4","空山鳥語 亮音句示範 二胡音色練習"],["dizi","竹笛","Dizi","吹管（橫吹）","明亮高亢，有一點「沙沙」的膜聲。常有顫音、快速裝飾音。像西洋長笛但更野、更亮。","dizi (bamboo flute), bright, breathy, trills","https://www.youtube.com/watch?v=HhCF_Yh65RQ","笛子演奏示範（千與千尋）"],["xiao","洞簫","Xiao","吹管（直吹）","柔、低、氣聲多，空靈安靜。比竹笛暗得多。","xiao (vertical bamboo flute), soft, airy, hollow","https://www.youtube.com/watch?v=hCB1qjA5HrE","洞簫純萃音色 蘇俊琪（戀花-簫清吹）"],["yangqin","揚琴","Yangqin","擊弦（竹槌）","像鋼琴和豎琴的混合：很多顆粒、很多亮亮的泛音，常有一串快速敲擊。","yangqin (hammered dulcimer), shimmering, struck strings","https://www.youtube.com/watch?v=idEZrOcCoEQ","落英 揚琴音色庫"],["sheng","笙","Sheng","吹管（簧片）","一次吹出好幾個音，像風琴或手風琴，有「和聲」感。","sheng (mouth organ), layered chords, reedy, organ-like","https://www.youtube.com/watch?v=aqgTzxPON2k","中國民樂好聲音 笙獨奏《西班牙舞曲》"]];const a=document.getElementById('a'),g=document.getElementById('g');
D.forEach(x=>{const d=document.createElement('div');d.className='card';d.id='c-'+x[0];d.innerHTML='<img class="ph" src="'+x[0]+'.jpg" alt="'+x[1]+'"><h2>'+x[1]+'<small>'+x[2]+'</small></h2><div class="fam">'+x[3]+'</div><button data-i="'+x[0]+'">▶ 播放音色</button><div class="spec" style="background-image:url('+x[0]+'-spec.png)"><i></i></div><div class="lg">上圖＝這段聲音的頻譜（橫軸時間，縱軸由低到高音，越亮越響），白線是播放位置</div><div class="tip">'+x[4]+'</div><div class="sun">寫進 Suno：'+x[5]+'</div><div class="src">來源：<a href="'+x[6]+'" target="_blank" rel="noopener">'+x[7]+'</a></div>';g.appendChild(d)});
let act=null;g.addEventListener('click',e=>{const i=e.target.dataset.i;if(!i)return;act=i;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.id==='c-'+i));a.src=i+'.mp3';a.play()});function tick(){const d=a.duration||30,p=Math.min(100,(a.currentTime/d)*100)+'%';if(act){const s=document.querySelector('#c-'+act+' .spec i');document.querySelectorAll('.spec i').forEach(x=>x.style.display='none');if(s){s.style.display='block';s.style.left=p}}const q=document.querySelector('#qs2 i');if(q)q.style.left=p;requestAnimationFrame(tick)}tick();
let cur=null,ok=0,tot=0;const op=document.getElementById('op'),res=document.getElementById('res');
D.forEach(x=>{const b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(!cur)return;tot++;if(x[0]===cur[0]){ok++;res.className='ok';res.textContent='答對了！是'+cur[1]}else{res.className='no';res.textContent='不是喔，這是'+cur[1]+'。口訣：'+cur[4]}const qi=document.getElementById('qi');qi.src=cur[0]+'.jpg';qi.style.display='block';document.getElementById('sc').textContent=' 成績 '+ok+' / '+tot;cur=null};op.appendChild(b)});
document.getElementById('qs').onclick=()=>{cur=D[Math.floor(Math.random()*D.length)];res.textContent='';act=null;document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));const q=document.getElementById('qs2');q.style.display='block';q.style.backgroundImage='url('+cur[0]+'-spec.png)';document.getElementById('qi').style.display='none';a.src=cur[0]+'.mp3';a.play()};
document.getElementById('qr').onclick=()=>{if(a.src){a.currentTime=0;a.play()}};
</script></main></body></html>
